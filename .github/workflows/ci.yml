# CI for Browser Read-or-Skip.
#
# The extension has zero runtime dependencies; the test suite and the
# packaging checker are zero-dependency Node scripts (jsdom is the only
# dev dependency).
#
# Runs on every push and every pull request. A test that is not wired into
# CI is not a gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      # 结果页 match pattern 必须与 src/lib/engines.js（搜索引擎的单一事实源）一致。
      # 三处定义漂移的后果是用户可见的静默故障：HUD 让位了但没注入标注，
      # 结果页上既看不到徽章也看不到浮层（空窗）。
      - name: Manifest / engines sync check
        run: node tools/sync-engines.mjs --check

      - name: Packaging self-check (whitelist)
        run: node tools/pack.mjs --check
