# Release for Browser Read-or-Skip.
#
# Builds the Chrome Web Store submission zip and publishes it as a GitHub
# Release. The zip is built HERE, never uploaded from a local build: the
# packer is whitelist-based, so the published artifact is reproducible from
# the tagged tree and provably contains only the runtime files — and, in
# particular, never the local API key file.
#
# Trigger: push a bare-semver tag, e.g. `git tag 1.1.0 && git push origin 1.1.0`.

name: Build and release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Packaging self-check (whitelist)
        run: node tools/pack.mjs --check

      - name: Verify tag matches manifest version
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi

      - name: Build store package
        run: node tools/pack.mjs --versioned

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "read-or-skip-*.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" read-or-skip-*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
