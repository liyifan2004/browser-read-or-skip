<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>Read or Skip</title>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h6a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H2z"/>
          <path d="M22 4h-6a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H22z"/>
        </svg>
      </span>
      <span class="name">Read or Skip</span>
    </div>
    <button id="gear" class="iconbtn" title="设置">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>
    </button>
  </header>

  <main id="main">
    <section class="card" id="card">
      <div class="loading" id="loading"><span class="spin"></span>正在读取当前页面…</div>
      <div class="verdictwrap" id="verdictwrap" hidden>
        <div class="ring" id="ring"></div>
        <div class="vtext">
          <div class="vlabel" id="vlabel">—</div>
          <div class="vreason" id="vreason"></div>
        </div>
      </div>
      <div class="metrics" id="metrics" hidden></div>
      <div class="chips" id="chips" hidden></div>
      <div class="metaline" id="metaline" hidden></div>
    </section>

    <section class="unsupported" id="unsupported" hidden>
      <div class="uicon">🚫</div>
      <div class="utitle">当前页面无法评估</div>
      <div class="udesc" id="udesc">浏览器内部页面、扩展商店页面不允许扩展注入脚本。</div>
    </section>

    <section class="toggles">
      <label class="row">
        <span class="rlabel">页面浮层<small>打开网页时显示判定卡片</small></span>
        <input type="checkbox" id="tg-hud" class="sw" />
      </label>
      <label class="row">
        <span class="rlabel">搜索结果标注<small>在 Google / 必应 / 百度 结果上打等级</small></span>
        <input type="checkbox" id="tg-serp" class="sw" />
      </label>
    </section>

    <section class="stats" id="stats"></section>
  </main>

  <footer class="bottom">
    <button id="reeval" class="btn primary">重新评估</button>
    <button id="openOptions" class="btn">打开设置</button>
  </footer>

  <script src="../lib/namespace.js"></script>
  <script src="../lib/constants.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
